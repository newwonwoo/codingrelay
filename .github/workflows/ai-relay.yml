name: AI Relay Harness

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  relay-status:
    name: Reply to relay status comments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness source
        uses: actions/checkout@v4

      - name: Resolve relay status source
        id: status-source
        uses: actions/github-script@v7
        with:
          script: |
            const isPullRequestComment = Boolean(context.payload.issue?.pull_request);

            core.setOutput("is_pr", String(isPullRequestComment));
            core.setOutput("path", ".");

            if (!isPullRequestComment) {
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });

            core.setOutput("repository", pull.head.repo.full_name);
            core.setOutput("ref", pull.head.sha);
            core.setOutput("path", "relay-status-source");

      - name: Checkout PR status source
        if: ${{ steps.status-source.outputs.is_pr == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.status-source.outputs.repository }}
          ref: ${{ steps.status-source.outputs.ref }}
          path: ${{ steps.status-source.outputs.path }}
          persist-credentials: false

      - name: Handle /relay status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/ai_relay_harness.py "${{ steps.status-source.outputs.path }}"
