name: AI Relay Harness

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  relay-status:
    name: Reply to relay status comments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Handle /relay status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/ai_relay_harness.py
